name: Publish Docker
on:
  push:
    branches:
      - main

jobs:
  github:
    strategy:
      matrix:
        repo: [ java_25, envoy ]

    runs-on: ubuntu-latest
    continue-on-error: true

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # 4.4.1

      - name: Determine upstream version
        # This step determines the version of the base image being built from the FROM tag in the Dockerfile so it can
        # be used as a tag later. It does that by continuously applying "cut" to remove parts of the last FROM string.
        id: upstream
        working-directory: ${{ matrix.repo }}
        run: |
          # Takes the last FROM line, which is the stage that ends up in the published image.
          #   Output: FROM envoyproxy/envoy:v1.40.1@sha256:713b...
          from_line=$(grep '^FROM' Dockerfile | tail -n 1)

          # Removes the "FROM " keyword.
          #   Input:  FROM envoyproxy/envoy:v1.40.1@sha256:713b...
          #   Output: envoyproxy/envoy:v1.40.1@sha256:713b...
          image=$(echo "$from_line" | cut -d' ' -f2)

          # Removes the digest, which is everything from the "@" onwards.
          #   Input:  envoyproxy/envoy:v1.40.1@sha256:713b...
          #   Output: envoyproxy/envoy:v1.40.1
          image_without_digest=$(echo "$image" | cut -d@ -f1)

          # Fails if the image has no tag, because there is no version to extract then. This is for image
          # addition/changes to ensure we don't publish broken tags.
          #   Input:  envoyproxy/envoy:v1.40.1
          if [[ "$image_without_digest" != *:* ]]; then
            echo "::error file=${{ matrix.repo }}/Dockerfile::The last FROM image has no tag: $image_without_digest"
            exit 1
          fi

          # Removes the image name, which is everything up to and including the ":".
          #   Input:  envoyproxy/envoy:v1.40.1
          #   Output: v1.40.1
          tag=$(echo "$image_without_digest" | cut -d: -f2)

          # Removes a leading "v", if there is one.
          #   Input:  v1.40.1
          #   Output: 1.40.1
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/stroeer/${{ matrix.repo }}
          # Create three Docker tags
          # 1. The version of the base image + short Git SHA (see action documentation) as an immutable tag
          # 2. Just the version of the base image as a mutable tag
          # 3. latest
          tags: |
            type=raw,value=${{ steps.upstream.outputs.version }}-{{sha}}
            type=raw,value=${{ steps.upstream.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.repo }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
