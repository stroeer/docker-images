name: Publish Docker
on:
  push:
    branches:
      - main

jobs:
  github:
    strategy:
      matrix:
        repo: [ java_25, envoy ]

    runs-on: ubuntu-latest
    continue-on-error: true

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # 4.4.1

      - name: Determine upstream version
        id: upstream
        uses: ./.github/actions/upstream-version
        with:
          context: ${{ matrix.repo }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/stroeer/${{ matrix.repo }}
          # Create three Docker tags
          # 1. The version of the base image + short Git SHA (see action documentation) as an immutable tag
          # 2. Just the version of the base image as a mutable tag
          # 3. latest
          tags: |
            type=raw,value=${{ steps.upstream.outputs.version }}-{{sha}}
            type=raw,value=${{ steps.upstream.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.repo }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
